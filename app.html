<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>💌</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    overflow-x:hidden;
}

/*
    Scene hiện tại
*/
#app{
    width:100%;
    min-height:100vh;
}

</style>

</head>

<body>

<!-- =====================================================
     NHẠC DUY NHẤT CỦA TOÀN BỘ WEB
===================================================== -->

<audio
    id="bgMusic"
    loop
    preload="auto"
>
    <source
        src="music.mp3"
        type="audio/mpeg"
    >
</audio>


<!-- =====================================================
     NƠI CHỨA 3 WEB
===================================================== -->

<div id="app"></div>

<script>

const music = document.getElementById("bgMusic");

music.volume = 0.35;


/* =====================================================
   LOAD SCENE
===================================================== */

async function loadScene(file) {

    const app =
        document.getElementById("app");


    /* =========================
       XÓA SCENE CŨ
    ========================= */

    app.innerHTML = "";


    /* =========================
       ĐỌC FILE HTML
    ========================= */

    const response =
        await fetch(file);

    if (!response.ok) {

        throw new Error(
            "Không thể load " + file
        );

    }


    const html =
        await response.text();


    /* =========================
       PARSE HTML
    ========================= */

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    /* =========================
       COPY CSS
    ========================= */

    const styles =
        [
            ...doc.querySelectorAll("style")
        ];

    styles.forEach(style => {

        const newStyle =
            document.createElement("style");

        newStyle.textContent =
            style.textContent;

        app.appendChild(
            newStyle
        );

    });


    /* =========================
       COPY BODY
    ========================= */

    const body =
        doc.body;


    /* =========================
       BỎ AUDIO CỦA SCENE
    ========================= */

    const oldMusic =
        body.querySelector(
            "#bgMusic"
        );

    if (oldMusic) {

        oldMusic.remove();

    }


    /* =========================
       ĐƯA HTML VÀO APP
    ========================= */

    const content =
        document.createElement("div");

    content.innerHTML =
        body.innerHTML;

    app.appendChild(
        content
    );


    /* =========================
       CHẠY SCRIPT CỦA SCENE
    ========================= */

    const scripts =
        [
            ...body.querySelectorAll("script")
        ];


    for (
        const oldScript of scripts
    ) {

        const newScript =
            document.createElement(
                "script"
            );


        /* SCRIPT INLINE */

        if (
            oldScript.textContent
        ) {

            newScript.textContent =
                oldScript.textContent;

        }


        /* SCRIPT CÓ SRC */

        if (
            oldScript.src
        ) {

            newScript.src =
                oldScript.src;

        }


        app.appendChild(
            newScript
        );

    }

}


/* =====================================================
   CHUYỂN MÀN
===================================================== */

window.App = {


    goToIndex() {

        loadScene(
            "index.html"
        );

    },


    goToPuzzle() {

        loadScene(
            "puzzle.html"
        );

    },


    goToEnding() {

        loadScene(
            "ending.html"
        );

    }

};


/* =====================================================
   BẮT ĐẦU WEB
===================================================== */

loadScene(
    "index.html"
);

</script>
</body>
</html>
