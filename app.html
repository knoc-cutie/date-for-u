<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>💌</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

#app{
    width:100%;
    height:100%;
}

#sceneFrame{
    display:block;
    width:100%;
    height:100%;
    border:none;
}    

</style>

</head>

<body>

<!-- =====================================================
     NHẠC DUY NHẤT CỦA TOÀN BỘ WEB
===================================================== -->

<audio
    id="bgMusic"
    loop
    preload="auto"
>
    <source
        src="music.mp3"
        type="audio/mpeg"
    >
</audio>


<!-- =====================================================
     NƠI CHỨA 3 WEB
===================================================== -->

<div id="app">
    <iframe
        id="sceneFrame"
        src="index.html"
        allow="autoplay"
    ></iframe>
</div>

<script>

const music =
    document.getElementById("bgMusic");

music.volume = 0.35;


/* =====================================================
   IFRAME CHÍNH
===================================================== */

const sceneFrame =
    document.getElementById("sceneFrame");


/* =====================================================
   CHUYỂN MÀN
===================================================== */

window.App = {

    goToIndex() {

        sceneFrame.src =
            "index.html";

    },


    goToPuzzle() {

        sceneFrame.src =
            "puzzle.html";

    },


    goToEnding() {

        sceneFrame.src =
            "ending.html";

    }

};

</script>
    
</body>
</html>
