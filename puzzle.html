<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>🧩 Một món quà nhỏ</title>


<style>

/* =========================================
   RESET
========================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================
   BODY
========================================= */

body {

    min-height: 100vh;

    font-family:
        'Poppins',
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffd6e7,
            #ffe8f3,
            #fff4fa
        );

    color: #444;

    overflow-x: hidden;
}


/* =========================================
   PUZZLE PAGE
========================================= */

#puzzlePage {

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding: 30px 15px;
}


/* =========================================
   TITLE
========================================= */

.title {

    text-align: center;

    margin-bottom: 25px;

    animation:
        fadeIn .8s ease;
}


.title h1 {

    color: #ff5fa2;

    font-size:
        clamp(25px, 4vw, 38px);

    margin-bottom: 10px;
}


.title p {

    font-size:
        clamp(16px, 2vw, 20px);

    line-height: 1.7;

    color: #555;
}


.title small {

    display: block;

    margin-top: 8px;

    color: #999;
}


/* =========================================
   PUZZLE BOARD
========================================= */

/*
    Ảnh gốc:

    6000 × 4000

    Tỉ lệ:

    3 : 2

    Chia thành:

    6 cột × 4 hàng

    = 24 mảnh
*/

#puzzle {

    width: min(900px, 94vw);

    aspect-ratio: 3 / 2;

    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    grid-template-rows:
        repeat(4, 1fr);

    gap: 3px;

    padding: 4px;

    background: white;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 20px 60px
        rgba(255, 105, 180, .20);

    animation:
        puzzleAppear 1s ease;
}


/* =========================================
   TỪNG MẢNH PUZZLE
========================================= */

.piece {

    width: 100%;

    height: 100%;

    background-image:
    url("./couple.jpg");

    /*
        6 cột
        4 hàng
    */

    background-size:
        600% 400%;

    background-repeat:
        no-repeat;

    cursor: pointer;

    transition:
        transform .2s ease,
        filter .2s ease,
        box-shadow .2s ease;

    position: relative;
}


/* hover */

.piece:hover {

    transform: scale(.96);

    filter: brightness(1.08);

    z-index: 5;
}


/* mảnh đang được chọn */

.piece.selected {

    transform: scale(.94);

    filter: brightness(1.15);

    box-shadow:
        0 0 0 4px #ff5fa2,
        0 0 20px
        rgba(255, 95, 162, .7);

    z-index: 10;
}


/* =========================================
   HINT
========================================= */

#hint {

    margin-top: 18px;

    color: #999;

    font-size: 14px;

    text-align: center;
}


/* =========================================
   SUCCESS
========================================= */

#success {

    position: fixed;

    inset: 0;

    display: none;

    justify-content: center;

    align-items: center;

    flex-direction: column;

    background:
        rgba(255, 244, 250, .95);

    z-index: 100;

    text-align: center;
}


#success h2 {

    color: #ff5fa2;

    font-size:
        clamp(28px, 5vw, 48px);

    margin-bottom: 15px;
}


#success p {

    color: #555;

    font-size: 18px;
}


.successHeart {

    font-size: 60px;

    margin-bottom: 15px;

    animation:
        heartBeat 1s infinite;
}


/* =========================================
   ANIMATION
========================================= */

@keyframes fadeIn {

    from {

        opacity: 0;

        transform:
            translateY(15px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes puzzleAppear {

    from {

        opacity: 0;

        transform:
            scale(.92);
    }

    to {

        opacity: 1;

        transform:
            scale(1);
    }
}


@keyframes heartBeat {

    0%,
    100% {

        transform:
            scale(1);
    }

    50% {

        transform:
            scale(1.15);
    }
}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px) {

    #puzzle {

        gap: 2px;

        padding: 2px;

        border-radius: 12px;
    }

    .title h1 {

        font-size: 25px;
    }

    .title p {

        font-size: 16px;
    }

}

</style>

</head>


<body>


<!-- ======================================
     PUZZLE
====================================== -->

<section id="puzzlePage">


    <div class="title">

        <h1>
            🧩 Một thử thách nhỏ cho cậu
        </h1>

        <small>
            Ghép lại thử xem có gì nha 🌷
        </small>

    </div>


    <!-- PUZZLE -->

    <div id="puzzle"></div>


    <div id="hint">

        💡 Bấm vào hai mảnh để đổi chỗ cho nhau

    </div>


</section>


<!-- ======================================
     SUCCESS
====================================== -->

<div id="success">

    <div class="successHeart">
        💖
    </div>

    <h2>
        Cậu ghép đúng rồi!
    </h2>

    <p>
        Có một điều nữa mình muốn cho cậu xem...
    </p>

</div>



<script>


/* =========================================
   PUZZLE CONFIG
========================================= */

const COLS = 6;

const ROWS = 4;

const TOTAL =
    COLS * ROWS;


/* =========================================
   STATE
========================================= */

let puzzle = [];

let selected = null;

let solved = false;


/* =========================================
   KHỞI TẠO
========================================= */

function initPuzzle() {


    /*
        Tạo:

        [0,1,2,3,...23]
    */

    puzzle =
        Array.from(
            {
                length: TOTAL
            },
            (_, i) => i
        );


    /*
        Shuffle
    */

    do {

        shuffle(puzzle);

    }
    while (isSolved());


    render();

}


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

}


/* =========================================
   VẼ PUZZLE
========================================= */

function render() {


    const board =
        document.getElementById(
            "puzzle"
        );


    board.innerHTML = "";


    puzzle.forEach(
        (pieceNumber, position) => {


            const piece =
                document.createElement(
                    "div"
                );


            piece.className =
                "piece";


            /*
                Mảnh này vốn nằm ở
                hàng / cột nào trong ảnh gốc?
            */

            const originalRow =
                Math.floor(
                    pieceNumber / COLS
                );


            const originalCol =
                pieceNumber % COLS;


            /*
                Tính vị trí background.

                6 cột:

                0%
                20%
                40%
                60%
                80%
                100%

                4 hàng:

                0%
                33.33%
                66.66%
                100%
            */

            const x =
                (
                    originalCol /
                    (COLS - 1)
                ) * 100;


            const y =
                (
                    originalRow /
                    (ROWS - 1)
                ) * 100;


            piece.style.backgroundPosition =
                `${x}% ${y}%`;


            /*
                Nếu đang được chọn
            */

            if (
                selected === position
            ) {

                piece.classList.add(
                    "selected"
                );

            }


            /*
                Click
            */

            piece.addEventListener(
                "click",
                () => selectPiece(position)
            );


            board.appendChild(piece);

        }
    );

}


/* =========================================
   CLICK MẢNH
========================================= */

function selectPiece(position) {


    if (solved) {
        return;
    }


    /*
        Click mảnh đầu tiên
    */

    if (selected === null) {

        selected = position;

        render();

        return;
    }


    /*
        Click lại chính mảnh đó
    */

    if (selected === position) {

        selected = null;

        render();

        return;
    }


    /*
        ĐỔI HAI MẢNH
    */

    const temp =
        puzzle[selected];


    puzzle[selected] =
        puzzle[position];


    puzzle[position] =
        temp;


    selected = null;


    render();


    /*
        Kiểm tra thắng
    */

    if (isSolved()) {

        solved = true;

        puzzleComplete();

    }

}


/* =========================================
   KIỂM TRA ĐÃ GHÉP ĐÚNG
========================================= */

function isSolved() {

    return puzzle.every(
        (piece, index) =>
            piece === index
    );

}


/* =========================================
   HOÀN THÀNH
========================================= */

function puzzleComplete() {

    document
        .getElementById("hint")
        .innerText =
        "💖 Đúng rồi đó...";


    const success =
        document.getElementById("success");


    success.style.display =
        "flex";


    /*
       Chờ hiệu ứng một chút
       rồi chuyển sang ending.
    */

    setTimeout(() => {

         window.top.document
        .getElementById("sceneFrame")
        .src = "ending.html";

    }, 2000);

}


/* =========================================
   START
========================================= */

initPuzzle();


</script>


</body>

</html>
